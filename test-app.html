<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farm Sim Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .error { color: red; background: #ffe6e6; padding: 10px; margin: 10px 0; }
        .success { color: green; background: #e6ffe6; padding: 10px; margin: 10px 0; }
    </style>
</head>
<body>
    <h1>Farm Simulation Loading Test</h1>
    <div id="status">Loading...</div>
    <div id="errors"></div>
    
    <script type="module">
        const statusDiv = document.getElementById('status');
        const errorsDiv = document.getElementById('errors');
        
        function logError(error) {
            console.error('Loading Error:', error);
            const errorDiv = document.createElement('div');
            errorDiv.className = 'error';
            errorDiv.textContent = `Error: ${error.message || error}`;
            errorsDiv.appendChild(errorDiv);
        }
        
        function logSuccess(message) {
            console.log('Success:', message);
            const successDiv = document.createElement('div');
            successDiv.className = 'success';
            successDiv.textContent = message;
            errorsDiv.appendChild(successDiv);
        }
        
        // Capture all errors
        window.addEventListener('error', (e) => {
            logError(e.error || e.message);
        });
        
        window.addEventListener('unhandledrejection', (e) => {
            logError(e.reason);
        });
        
        try {
            statusDiv.textContent = 'Loading React...';
            
            // Test import of main component
            import('./src/main.jsx').then(() => {
                logSuccess('Main.jsx imported successfully');
                statusDiv.textContent = 'React app loaded successfully!';
            }).catch(error => {
                logError(error);
                statusDiv.textContent = 'Failed to load React app';
            });
            
        } catch (error) {
            logError(error);
            statusDiv.textContent = 'Failed to start loading process';
        }
    </script>
</body>
</html>
