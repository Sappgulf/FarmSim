name: FarmSim
options:
  deploymentTarget:
    iOS: "17.0"
packages:
  GameCore:
    path: GameCore
targets:
  FarmSim:
    type: application
    platform: iOS
    info:
      path: App/Info.plist
      properties:
        UIStatusBarHidden: false
        UIViewControllerBasedStatusBarAppearance: true
        UILaunchScreen:
          UIColorName: systemGreenColor
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    sources:
      - path: App/Sources
      - path: App/Assets.xcassets
      - path: ../shared/content
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.austinbeatty.farmsim
        PRODUCT_NAME: FarmSim
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: 5.10
        INFOPLIST_FILE: App/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - package: GameCore
        product: GameCore
schemes:
  FarmSim:
    build:
      targets:
        FarmSim: all
    run:
      config: Debug
    archive:
      config: Release
