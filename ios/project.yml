name: FarmSim
options:
  deploymentTarget:
    iOS: "17.0"
packages:
  GameCore:
    path: GameCore
targets:
  FarmSim:
    type: application
    platform: iOS
    info:
      path: App/Info.plist
      properties:
        UIStatusBarHidden: false
        UIViewControllerBasedStatusBarAppearance: true
        UILaunchScreen:
          UIColorName: systemGreenColor
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    sources:
      - path: App/Sources
      - path: App/Assets.xcassets
      - path: App/Resources
        buildPhase: resources
      - path: ../shared/content
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.austinbeatty.farmsim
        PRODUCT_NAME: FarmSim
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIconV4
        SWIFT_VERSION: 5.10
        INFOPLIST_FILE: App/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - package: GameCore
        product: GameCore
  FarmSimTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: GameCore/Tests/GameCoreTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.austinbeatty.farmsim.tests
        INFOPLIST_FILE: GameCore/Tests/GameCoreTests/Info.plist
    dependencies:
      - package: GameCore
        product: GameCore
  FarmSimAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AppTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.austinbeatty.farmsim.app-tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/FarmSim.app/FarmSim"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: FarmSim
      - package: GameCore
        product: GameCore
schemes:
  FarmSim:
    build:
      targets:
        FarmSim: all
        FarmSimTests: test
        FarmSimAppTests: test
    run:
      config: Debug
    archive:
      config: Release
    test:
      config: Debug
      targets:
        - FarmSimAppTests
  GameCoreTests:
    build:
      targets:
        FarmSimTests: test
    test:
      config: Debug
      targets:
        - FarmSimTests
